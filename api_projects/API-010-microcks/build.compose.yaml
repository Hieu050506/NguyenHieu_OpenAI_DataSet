services:
  build:
    build:
      context: ../../sources/WFD/scripts/build
      dockerfile: Dockerfile.jdk21
    working_dir: /build/jdk_21_maven
    environment:
      BUILD_EVOMASTER: 'false'
    volumes:
    - ../../sources/WFD/jdk_21_maven:/build/jdk_21_maven
    - ../../sources/WFD/dist:/dist
    - maven-cache:/root/.m2
    - gradle-cache:/root/.gradle
    command:
    - bash
    - -lc
    - 'set -e

      mvn -f cs/pom.xml -pl rest-gui/microcks -am install -DskipTests

      cp cs/rest-gui/microcks/webapp/target/microcks-sut.jar /dist/'
volumes:
  maven-cache: {}
  gradle-cache: {}
