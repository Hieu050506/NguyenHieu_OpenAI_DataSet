services:
  mitmproxy:
    image: mitmproxy/mitmproxy:10.2.4
    user: 0:0
    environment:
      MITM_LOG_DIR: /custom-logs
      MITM_LOG_FILE: ${MITM_LOG_FILE:-minlog.csv}
    command: "mitmdump \n  --mode reverse:http://sut-user-management:8080\n  --listen-host\
      \ 0.0.0.0\n  --listen-port 8080\n  --set keep_host_header=true\n  -s /addons/minlog.py\n"
    volumes:
    - ../../results/API-020-user-management/traffic:/custom-logs
    - ../../sources/WFD/dockerfiles/addons:/addons:ro
    ports:
    - 127.0.0.1:8120:8080
    depends_on:
    - sut-user-management
  sut-user-management:
    build:
      dockerfile: ./dockerfiles/user-management.dockerfile
      context: ../../sources/WFD
    environment:
      AUTH_PORT: ${AUTH_PORT:-8081}
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mysql:8.0
    tmpfs:
    - /var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: users
    healthcheck:
      test:
      - CMD
      - mysqladmin
      - ping
      - -h
      - localhost
      interval: 30s
      timeout: 30s
      retries: 3
