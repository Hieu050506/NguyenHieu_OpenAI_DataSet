services:
  mitmproxy:
    image: mitmproxy/mitmproxy:10.2.4
    user: 0:0
    environment:
      MITM_LOG_DIR: /custom-logs
      MITM_LOG_FILE: ${MITM_LOG_FILE:-minlog.csv}
    command: "mitmdump \n  --mode reverse:http://sut-ocvn:8080\n  --listen-host 0.0.0.0\n\
      \  --listen-port 8080\n  --set keep_host_header=true\n  -s /addons/minlog.py\n"
    volumes:
    - ../../results/API-011-ocvn/traffic:/custom-logs
    - ../../sources/WFD/dockerfiles/addons:/addons:ro
    ports:
    - 127.0.0.1:8111:8080
    depends_on:
    - sut-ocvn
  sut-ocvn:
    build:
      dockerfile: ./dockerfiles/ocvn.dockerfile
      context: ../../sources/WFD
    environment:
      AUTH_PORT: ${AUTH_PORT:-8081}
  db:
    image: mongo:3.2
    tmpfs:
    - /data/db
