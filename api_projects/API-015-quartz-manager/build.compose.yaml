services:
  build:
    build:
      context: ../../sources/WFD/scripts/build
      dockerfile: Dockerfile.jdk11
    working_dir: /build/jdk_11_maven
    environment:
      BUILD_EVOMASTER: 'false'
    volumes:
    - ../../sources/WFD/jdk_11_maven:/build/jdk_11_maven
    - ../../sources/WFD/dist:/dist
    - maven-cache:/root/.m2
    - gradle-cache:/root/.gradle
    command:
    - bash
    - -lc
    - 'set -e

      mvn -f cs/pom.xml -pl rest-gui/quartz-manager -am install -DskipTests

      cp cs/rest-gui/quartz-manager/quartz-manager-parent/quartz-manager-web-showcase/target/quartz-manager-sut.jar
      /dist/'
volumes:
  maven-cache: {}
  gradle-cache: {}
